<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法鼓 3D 校園</title>
<meta name="description" content="法鼓文理學院與法鼓山世界佛教教育園區的互動 3D 導覽（雛形）">
<link rel="stylesheet" href="src/style.css?v=20261126w">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="map">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="loading">載入校園中…</div>
    <div class="map-tools">
      <button id="btn-panel" title="地標列表" aria-label="地標列表">☰</button>
      <button id="btn-north" title="轉回正北" aria-label="轉回正北"><span>N</span></button>
      <button id="btn-reset" title="回到全景" aria-label="回到全景">⌂</button>
      <button id="btn-fs" title="全螢幕" aria-label="全螢幕">⛶</button>
    </div>
    <div class="style-tools" role="group" aria-label="畫風">
      <button data-style="real">寫實</button><button data-style="pastel">清雅</button><button data-style="ink">水墨</button><button data-style="fairy">童話</button>
    </div>
    <div class="paper" aria-hidden="true"></div>
    <div class="layer-tools">
      <label><input type="checkbox" id="opt-trees" checked> 樹木</label>
      <label><input type="checkbox" id="opt-labels" checked> 標籤</label>
    </div>
    <div class="credit">底圖：國土測繪中心 NLSC 正射影像｜建物：© OpenStreetMap contributors｜地形：AWS Terrain Tiles｜雛形版，建物高度依樓層推估</div>
  </div>
  <aside id="panel">
    <header>
      <h1>法鼓 3D 校園</h1>
      <p>法鼓文理學院・法鼓山世界佛教教育園區</p>
    </header>
    <div id="card" hidden>
      <button id="card-close" aria-label="關閉">×</button>
      <div class="card-group"></div>
      <h2></h2>
      <p class="card-desc"></p>
      <a class="card-src" target="_blank" rel="noopener" hidden>資料來源 ↗</a>
      <button class="card-more" hidden>照片與詳細介紹</button>
    </div>
    <div id="list"></div>
    <footer>拖曳旋轉・右鍵或雙指平移・滾輪縮放</footer>
  </aside>
</div>
<div id="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header>
      <div>
        <div class="modal-group"></div>
        <h2 id="modal-title"></h2>
      </div>
      <button class="modal-close" aria-label="關閉">×</button>
    </header>
    <div class="modal-body">
      <figure class="gallery">
        <div class="gallery-main">
          <img alt="">
          <button class="nav prev" aria-label="上一張">‹</button>
          <button class="nav next" aria-label="下一張">›</button>
          <div class="gallery-count"></div>
        </div>
        <figcaption></figcaption>
        <div class="thumbs"></div>
      </figure>
      <div class="no-photo" hidden>尚無照片</div>
      <ul class="facts"></ul>
      <div class="detail"></div>
      <div class="sources"></div>
    </div>
  </div>
</div>
<script type="module" src="src/app.js?v=20261126w"></script>
</body>
</html>
